[project]
name = "ghidra-mcp-c64"
version = "0.1.0"
description = "C64-specific MCP tools for Ghidra and the Ghidra VICE connector"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp==1.28.1"]

[project.scripts]
ghidra-mcp-c64 = "ghidra_mcp_c64.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_mcp_c64"]

[tool.hatch.build.targets.wheel.force-include]
"src/ghidra_mcp_c64/text/tables.json" = "ghidra_mcp_c64/text/tables.json"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ghidra_mcp_c64"]
mypy_path = "src"
