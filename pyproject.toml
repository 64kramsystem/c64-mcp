[project]
name = "c64-mcp"
version = "0.99.0"
description = "C64-specific MCP tools for Ghidra and the Ghidra VICE connector"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp==1.28.1"]

[project.scripts]
c64-mcp = "c64_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c64_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/c64_mcp/text/tables.json" = "c64_mcp/text/tables.json"
"src/c64_mcp/profiles/c64.json" = "c64_mcp/profiles/c64.json"
"src/c64_mcp/contracts/c64-vice-api-v1.json" = "c64_mcp/contracts/c64-vice-api-v1.json"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["c64_mcp"]
mypy_path = "src"
